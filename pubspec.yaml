name: han1me_win_plus
description: Windows-focused fork of Han1mePlus, a Flutter client for browsing Han1me content.
publish_to: 'none'
version: 1.1.17+28

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  html: ^0.15.5
  path_provider: ^2.1.5
  path: ^1.9.1
  package_info_plus: ^8.1.2
  share_plus: ^10.1.2
  video_player: ^2.9.2
  video_player_media_kit: ^2.0.0
  media_kit: ^1.2.1
  media_kit_video: ^2.0.0
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_macos_video: ^1.0.5
  media_kit_libs_linux: ^1.2.1
  shared_preferences: ^2.3.3
  window_manager: ^0.5.1
  dynamic_color: ^1.7.0
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5
  open_filex: ^4.7.0
  archive: ^4.0.9
  file_picker: ^8.1.7
  charset: ^2.0.1
  flutter_staggered_grid_view: ^0.7.0
  m3e_core: ^1.1.1
  material_ui: ^1.1.0
  dlna_dart: ^0.0.8
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # 应用内置字体：MiSans（小米科技有限责任公司，遵循《MiSans 字体知识产权许可协议》，
    # 免费商用；按协议要求在「关于 → 致谢」中署名）。
    # 只随包提供 Regular 一档。Flutter 不会对普通文本字体做 tree-shake（--tree-shake-icons
    # 只管图标字体），pubspec 里声明几档字重就会把几个完整的全量 CJK 字库原样打进安装包：
    # 单档 7.8 MB，四档合计 31 MB；LZMA 压缩后每档约占安装包 4.3 MB（四档 → 单档省 12.9 MB）。
    #
    # 缺档字重的实际表现（实测：dart:ui 栅格化后比较墨迹总量）：
    #   - w600 / w700 会落到这一档并做合成加粗，墨迹约为 400 的 1.47 倍（真 Bold 对照为
    #     1.11 倍，故观感偏重），且 w600 与 w700 渲染完全一致，四档层次只剩两级；
    #   - w500 被静默忽略、与 400 完全一致（没有合成加粗）。所以 Material 3 默认取 w500 的
    #     titleMedium / titleSmall / label* 会比四档时期更轻。
    # 若要让 w500 或 w600/w700 用上真字重，把对应的 MiSans-Medium / MiSans-Demibold 补回
    # 下面的 fonts 列表即可（每档约 +4.3 MB 安装包体积）。
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
  assets:
    - assets/logo.png
    - assets/search_options/
    - assets/shaders/

flutter_native_splash:
  color: '#f7f7fb'
  color_dark: '#101114'
  image: assets/logo.png
  image_dark: assets/logo.png
  android_12:
    color: '#f7f7fb'
    color_dark: '#101114'
    image: assets/logo.png
    image_dark: assets/logo.png
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: assets/logo.png
  adaptive_icon_background: '#101114'
  adaptive_icon_foreground: assets/logo.png
