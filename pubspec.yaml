name: han1me_win_plus
description: Windows-focused fork of Han1mePlus, a Flutter client for browsing Han1me content.
publish_to: 'none'
version: 1.1.19+30

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  html: ^0.15.5
  path_provider: ^2.1.5
  path: ^1.9.1
  package_info_plus: ^8.1.2
  share_plus: ^10.1.2
  video_player: ^2.9.2
  video_player_media_kit: ^2.0.0
  media_kit: ^1.2.1
  media_kit_video: ^2.0.0
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_macos_video: ^1.0.5
  media_kit_libs_linux: ^1.2.1
  shared_preferences: ^2.3.3
  window_manager: ^0.5.1
  dynamic_color: ^1.7.0
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5
  open_filex: ^4.7.0
  archive: ^4.0.9
  file_picker: ^8.1.7
  charset: ^2.0.1
  flutter_staggered_grid_view: ^0.7.0
  m3e_core: ^1.1.1
  material_ui: ^1.1.0
  dlna_dart: ^0.0.8
  flutter_cache_manager: ^3.4.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # 应用内置字体：HarmonyOS Sans SC（鸿蒙黑体），版权 2021 Huawei Device Co., Ltd.，
    # 依《HarmonyOS Sans Fonts License Agreement》免费使用（协议允许随软件嵌入、打包、
    # 再分发，含商业用途；要求署名、保留协议副本、不得修改字体文件）。
    # 协议副本随包提供：assets/fonts/HarmonyOS_Sans_SC_LICENSE.txt
    #
    # 这个文件是**可变字体**（variable font），单文件内含 wght 轴 40–900 共 9 档字重
    # （Thin / UltraLight / Light / Regular / Medium / SemiBold / Bold / Heavy / Black），
    # 所以只声明一次就能拿到全部字重。Flutter 不会对普通文本字体做 tree-shake
    # （--tree-shake-icons 只管图标字体），静态字体声明几档就打进几个全量 CJK 字库：
    # 可变字体单文件 19.7 MB ↔ MiSans 静态四档合计约 31 MB。
    #
    # 实测（dart:ui 栅格化后比较墨迹总量，w400 = 16136）：
    #   w500 = 18130（1.12x）、w600 = 20114（1.25x）、w700 = 22186（1.38x）
    #   —— 引擎会把 FontWeight 映射到 wght 轴，拿到的是真实字重；静态单档字体则会把
    #      w500 静默忽略、把 w600/w700 合成加粗。用 fontVariations 显式指定 wght=500/700
    #      得到的墨迹与 FontWeight.w500/w700 完全一致，可确认这就是轴插值。
    #
    # 协议禁止修改字体（含实例化、子集化），上面的 ttf 必须保持官方原样。
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC.ttf
          weight: 400
  assets:
    - assets/logo.png
    - assets/search_options/
    - assets/shaders/
    # 字体许可协议要求随字体副本一并保留协议原文，故作为资源打进安装包。
    - assets/fonts/HarmonyOS_Sans_SC_LICENSE.txt

flutter_native_splash:
  color: '#f7f7fb'
  color_dark: '#101114'
  image: assets/logo.png
  image_dark: assets/logo.png
  android_12:
    color: '#f7f7fb'
    color_dark: '#101114'
    image: assets/logo.png
    image_dark: assets/logo.png
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: assets/logo.png
  adaptive_icon_background: '#101114'
  adaptive_icon_foreground: assets/logo.png
