name: Build Windows

# 只在打 tag（v*，编译 + 打包 + 发 Release）、PR 和手动触发（workflow_dispatch）
# 时构建；平时推 master 分支不触发 —— 本地验证过再推，省下每次 12 分钟的 CI。
# 临时想验证某个提交：Actions 页面手动 Run workflow，或对着 master 开一个 PR。
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 分支/PR 的新提交可以取消旧构建，tag 的发布构建不允许被打断
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 发布（tag）时要完整历史与已有 tag 才能生成更新日志，平时只取最新提交即可。
          # 注意：不能写成 `... && 0 || 1` —— GitHub 表达式里 0 是假值，会被 `||` 兜成 1，
          # 于是发布构建也变成浅克隆：git describe 拿不到父提交，更新日志只剩最后一个提交。
          # 用字符串 '0' / '1'（非空字符串为真）才可靠。
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}

      # 版本号以 .fvmrc 为唯一来源，避免 CI 与本地 Flutter 版本漂移
      - name: Read pinned Flutter version
        id: fvm
        shell: pwsh
        run: |
          $version = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          if ([string]::IsNullOrWhiteSpace($version)) { throw '.fvmrc 里没有 flutter 字段' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "使用 Flutter $version"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v3

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      # tag 必须与 pubspec.yaml 的版本号一致，否则直接失败，避免发出对不上号的包
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+(?:\.[0-9]+)*)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            $tagVersion = ($tag -replace '^[vV]', '') -replace '-.*$', ''
            if ($tagVersion -ne $pubspecVersion) {
              throw "tag '$tag' 的版本 $tagVersion 与 pubspec.yaml 的 $pubspecVersion 不一致，请先改 pubspec.yaml 再打 tag"
            }
            Write-Host "发布版本: $tagVersion (tag: $tag)"
          }
          else {
            Write-Host "仅构建验证，版本: $pubspecVersion"
          }
          "release_version=$pubspecVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        shell: pwsh
        env:
          # 用环境变量传递，避免把表达式拼进脚本正文
          APP_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe: $iscc" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" windows\installer.iss
          # 单文件产物（UseSetupLdr=yes，Inno 默认）：Setup.exe 自包含全部数据。
          # 曾经为了绕开一个本机环境问题改成过 no（产物拆成三个文件），后来查明
          # 那个问题只发生在开发机的工作区目录下，与包无关 —— 详见 installer.iss
          # 里 [Setup] 段的说明。现在恢复单文件，好处是用户只需下载一个文件，
          # 而且能走 SignTool + SignedUninstaller 的编译期签名。
          if (-not (Test-Path 'build\Han1meWinPlus-Setup.exe')) { throw '安装包未生成' }
          Get-Item 'build\Han1meWinPlus-Setup.exe' | Select-Object Name, Length

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'build\Han1meWinPlus-windows-x64.zip' -Force

      # 生成 SHA256 校验文件，方便用户核对下载是否完整（同时会写进发布说明）
      - name: Build SHA256 checksums
        shell: pwsh
        run: |
          # 安装包现在只有 1 个文件（见 Build Windows installer 里的说明）
          $files = @(
            'build\Han1meWinPlus-Setup.exe',
            'build\Han1meWinPlus-windows-x64.zip'
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  " + (Split-Path $f -Leaf)
          }
          $lines | Set-Content 'build\SHA256SUMS.txt' -Encoding utf8NoBOM
          Get-Content 'build\SHA256SUMS.txt'

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Han1meWinPlus-Setup
          path: build/Han1meWinPlus-Setup.exe
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v6
        with:
          name: Han1meWinPlus-windows-x64-portable
          path: build/Han1meWinPlus-windows-x64.zip
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v6
        with:
          name: Han1meWinPlus-SHA256SUMS
          path: build/SHA256SUMS.txt
          if-no-files-found: error

      # ---- 代码签名（SignPath Foundation 免费 OSS 签名）----
      #
      # **默认不执行**：只有仓库里配好了 SignPath 的四个变量才会跑（见下面 `if`）。
      # 没配时整步跳过，发布流程照常产出未签名包 —— 也就是「随时可以接上，
      # 接不上也不会把发布卡住」。
      #
      # 为什么要把签名产物再走一遍发布：SignPath 是「把产物提交过去、它签好还回来」，
      # 签名后的文件与本地构建的不是同一个字节流，所以校验值和 Release 都要用签过的那份。
      #
      # 需要配置的（仓库 Settings → Secrets and variables → Actions）：
      #   Secret   SIGNPATH_API_TOKEN          SignPath 的 CI 用户 API token
      #   Variable SIGNPATH_ORGANIZATION_ID    组织 id（GUID）
      #   Variable SIGNPATH_PROJECT_SLUG       项目 slug
      #   Variable SIGNPATH_POLICY_SLUG        签名策略 slug（如 release-signing）
      #   Variable SIGNPATH_ARTIFACT_SLUG      产物配置 slug（如 windows-installer）
      # 申请入口 https://signpath.org/apply ，条款 https://www.signpath.org/terms
      - name: Upload unsigned artifacts for signing
        id: upload-unsigned
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-artifacts
          # 两份都要签，各自在 SignPath 里对应一个 Artifact Configuration：
          # - 安装包：用户双击的就是它，被判「未知发布者」的也是它
          # - 主程序 exe：免安装版解压后直接运行它，不签的话那条件照样被拦
          # ⚠️ 两者要用**同一个** artifact 上传（SignPath 一次请求签一个 artifact），
          #    因此 Artifact Configuration 的根元素应当是 `<zip-file>`，里面按文件名
          #    分别声明 `<pe-file>`。上传时不加 `archive: false`，让 GitHub 打成 zip。
          path: |
            build/Han1meWinPlus-Setup.exe
            build/windows/x64/runner/Release/han1me_win_plus.exe
          if-no-files-found: error

      - name: Sign artifacts via SignPath
        id: signpath
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace artifacts with signed ones
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          # 按**文件名**认领，不能只取第一个 exe —— 签名的有两份（安装包 + 主程序），
          # 顺序不可依赖，取错了会把主程序当成安装包覆盖掉。
          $signedFiles = Get-ChildItem 'signed' -Filter '*.exe' -Recurse -File
          $signedFiles | ForEach-Object { Write-Host "  签名产物: $($_.Name)  $($_.Length) 字节" }

          function Take-Signed([string]$fileName) {
            $hit = $signedFiles | Where-Object { $_.Name -eq $fileName } | Select-Object -First 1
            if (-not $hit) { throw "签名产物里找不到 $fileName" }
            return $hit.FullName
          }

          # 1) 安装包
          Copy-Item (Take-Signed 'Han1meWinPlus-Setup.exe') 'build\Han1meWinPlus-Setup.exe' -Force
          # 2) 主程序，放回 Release 目录，随后的免安装压缩包要从这里取
          Copy-Item (Take-Signed 'han1me_win_plus.exe') `
                    'build\windows\x64\runner\Release\han1me_win_plus.exe' -Force

          # 3) 重新打免安装压缩包：原来那次是在签名**之前**打的（第 102 行附近），
          #    里面还是未签名的 exe，必须用签过的重打一遍，否则两种分发方式一签一不签。
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' `
                           -DestinationPath 'build\Han1meWinPlus-windows-x64.zip' -Force

          # 4) 重算校验值：签完字节流变了，不重算用户按 SHA256SUMS.txt 核对必然对不上
          $files = @('build\Han1meWinPlus-Setup.exe', 'build\Han1meWinPlus-windows-x64.zip')
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  " + (Split-Path $f -Leaf)
          }
          $lines | Set-Content 'build\SHA256SUMS.txt' -Encoding utf8NoBOM

          # 5) 签名是否真的生效要落证据，不能只看步骤绿了就当签上了
          $ok = $true
          foreach ($f in @('build\Han1meWinPlus-Setup.exe', 'build\windows\x64\runner\Release\han1me_win_plus.exe')) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f`n  状态: $($sig.Status)`n  签名者: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $ok = $false }
          }
          if (-not $ok) { throw '有文件签名无效，不要发布' }
          Get-Content 'build\SHA256SUMS.txt'

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          # git 输出是 UTF-8，PowerShell 默认按本地代码页解码会把中文提交信息变成乱码
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 与上一个 tag 之间的提交作为更新日志
          $previous = git describe --tags --abbrev=0 "$env:TAG^" 2>$null
          if ([string]::IsNullOrWhiteSpace($previous) -or $LASTEXITCODE -ne 0) {
            $range = $env:TAG
            $compare = ''
          }
          else {
            $previous = $previous.Trim()
            $range = "$previous..$env:TAG"
            $compare = "**完整对比**: https://github.com/$env:REPO/compare/$previous...$env:TAG"
          }
          # 按提交类型分组（新功能 / 改进 / 修复）：发布说明是给用户读的，分组比把标题
          # 平铺成一列好扫读。按提交前缀归类，前缀会从标题里去掉。
          #
          # 前缀**中英都要认**：仓库规范（AGENTS.md）要求提交信息用中文类型
          # （`修复(范围): …`），而这里原来只认英文 Conventional Commits ——
          # 结果是发版说明里所有条目都掉进「改进」，还把版本号提交也原样列出来
          # （例如「构建(发布): 版本号升到 1.1.27+38」），读起来不像给用户看的说明。
          $groups = [ordered]@{ '新功能' = @(); '改进' = @(); '修复' = @() }
          foreach ($line in (git log $range --no-merges --pretty=format:'%s')) {
            $text = $line.Trim()
            if ([string]::IsNullOrWhiteSpace($text)) { continue }
            # 版本号提交不进发布说明（它只负责把 pubspec 的版本号推上去）
            if ($text -match '^(chore\s*\(\s*release\s*\)|构建\s*\(\s*发布\s*\))') { continue }
            $bucket = '改进'
            if ($text -match '^(feat|feature)\s*(\(|:|：)' -or $text -match '^功能\s*(\(|:|：)') { $bucket = '新功能' }
            elseif ($text -match '^(fix|bugfix|hotfix|perf)\s*(\(|:|：)' -or $text -match '^修复\s*(\(|:|：)') { $bucket = '修复' }
            # 去掉类型前缀只留正文；没有前缀的提交原样归入「改进」
            $clean = $text -replace '^(feat|feature|fix|bugfix|hotfix|perf|refactor|chore|docs|style|test|build|ci)\s*(\([^)]*\))?\s*[:：]\s*', ''
            $clean = $clean -replace '^(功能|修复|重构|文档|样式|测试|构建|杂项|性能)\s*(\([^)]*\))?\s*[:：]\s*', ''
            $groups[$bucket] += "- $clean"
          }
          $sections = ($groups.GetEnumerator() | Where-Object { $_.Value.Count -gt 0 } | ForEach-Object { "## $($_.Key)" + [Environment]::NewLine + [Environment]::NewLine + ($_.Value -join [Environment]::NewLine) }) -join ([Environment]::NewLine + [Environment]::NewLine)
          if ([string]::IsNullOrWhiteSpace($sections)) { $sections = '## 改进' + [Environment]::NewLine + [Environment]::NewLine + '- 仅版本号变更' }

          # 产物清单：体积 + 校验值（方便用户核对下载完整性）
          # 注意：PowerShell 里逗号(,)的优先级高于加号(+)，所以不能在 @( ) 数组字面量里
          # 直接写 'a' + $x + 'b' —— 那会被解析成「数组 + 字符串 = 数组追加元素」，
          # -join 之后每段会各占一行。这里改用 foreach 逐行生成字符串。
          $sumRows = foreach ($f in @(
              (Get-Item 'build\Han1meWinPlus-Setup.exe'),
              (Get-Item 'build\Han1meWinPlus-windows-x64.zip'))) {
            $size = [math]::Round($f.Length / 1MB, 2)
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "| $($f.Name) | $size MB | $hash |"
          }
          $sumTable = (@('| 文件 | 体积 | SHA256 |', '| --- | --- | --- |') + $sumRows) -join [Environment]::NewLine

          $notes = @"
          ## Han1meWinPlus $env:TAG

          已经在运行旧版本？应用内会自动提示更新，也可在 设置 → 关于 手动检查。

          $sections

          $compare

          ## 下载

          $sumTable

          **系统要求**：Windows 10（1809 及以上）/ Windows 11，64 位。

          ## 安装

          1. 下载 ``Han1meWinPlus-Setup.exe``（单文件），双击安装
          2. 首次运行 Windows 可能提示「未知发布者」或被 SmartScreen 拦下：点「更多信息」→「仍要运行」即可（安装包尚未做代码签名，见 docs/code-signing.md）
          3. 安装默认需要管理员权限（装到 ``Program Files``）。如果你的账户是纯标准用户（不在
             Administrators 组里），可以用 ``Han1meWinPlus-Setup.exe /CURRENTUSER`` 免管理员安装到用户目录。
          4. 不想安装就用 ``Han1meWinPlus-windows-x64.zip``，解压后直接运行 ``han1me_win_plus.exe``

          ## 卸载

          卸载时可以选择是否一并清理应用数据：

          - **设置与观看记录**、**网页缓存与登录状态**（默认询问，可自行勾选）
          - **下载的视频**会单独再问一次，默认**不删** —— 那是你自己的文件

          若卸载时应用还在运行，安装程序会先把它关掉，避免残留文件。如果是手动删除安装
          目录，请先退出应用（包括独立播放窗口），否则正在使用的 exe/dll 删不掉。

          ## 已知问题

          - 安装包尚未做代码签名，SmartScreen 或杀毒软件可能误报
          - 部分站点图片 CDN 响应较慢，首屏封面可能需要等待，之后会走本地缓存
          - 仅维护 Windows，其他平台不在本项目范围内

          ## 说明

          基础代码来自 [Han1mePlus](https://github.com/1wc10086/Han1mePlus)，本项目在此基础上专注 Windows 端。
          应用数据保存在 ``%APPDATA%\han1me_win_plus\``，覆盖安装或升级不会丢失。
          "@

          $notesPath = Join-Path $env:RUNNER_TEMP_DIR 'release-notes.md'
          [System.IO.File]::WriteAllText($notesPath, $notes)
          Write-Host $notes

          gh release create $env:TAG `
            build/Han1meWinPlus-Setup.exe `
            build/Han1meWinPlus-windows-x64.zip `
            build/SHA256SUMS.txt `
            --title "Han1meWinPlus $env:TAG" `
            --notes-file $notesPath `
            --verify-tag
