name: Build Windows

# 打 tag（v*）时编译 + 打包 + 发 Release；
# 推送到 win 分支或 PR 时只做构建验证，不发 Release。
on:
  push:
    branches: [win]
    tags: ['v*']
  pull_request:
    branches: [win]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 分支/PR 的新提交可以取消旧构建，tag 的发布构建不允许被打断
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号以 .fvmrc 为唯一来源，避免 CI 与本地 Flutter 版本漂移
      - name: Read pinned Flutter version
        id: fvm
        shell: pwsh
        run: |
          $version = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          if ([string]::IsNullOrWhiteSpace($version)) { throw '.fvmrc 里没有 flutter 字段' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "使用 Flutter $version"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      # tag 必须与 pubspec.yaml 的版本号一致，否则直接失败，避免发出对不上号的包
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+(?:\.[0-9]+)*)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            $tagVersion = ($tag -replace '^[vV]', '') -replace '-.*$', ''
            if ($tagVersion -ne $pubspecVersion) {
              throw "tag '$tag' 的版本 $tagVersion 与 pubspec.yaml 的 $pubspecVersion 不一致，请先改 pubspec.yaml 再打 tag"
            }
            Write-Host "发布版本: $tagVersion (tag: $tag)"
          }
          else {
            Write-Host "仅构建验证，版本: $pubspecVersion"
          }
          "release_version=$pubspecVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        shell: pwsh
        env:
          # 用环境变量传递，避免把表达式拼进脚本正文
          APP_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe: $iscc" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" windows\installer.iss
          if (-not (Test-Path 'build\Han1meWinPlus-Setup.exe')) { throw '安装包未生成' }
          Get-Item 'build\Han1meWinPlus-Setup.exe' | Select-Object Name, Length

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'build\Han1meWinPlus-windows-x64.zip' -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Han1meWinPlus-Setup
          path: build/Han1meWinPlus-Setup.exe
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: Han1meWinPlus-windows-x64-portable
          path: build/Han1meWinPlus-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          ## 下载

          - 安装版：``Han1meWinPlus-Setup.exe``
          - 免安装：``Han1meWinPlus-windows-x64.zip``

          ## 说明

          基于上游 [Han1mePlus](https://github.com/1wc10086/Han1mePlus) 的 Windows 专修分支。
          未做代码签名，首次运行可能出现「未知发布者」提示。
          "@
          gh release create $env:GITHUB_REF_NAME `
            build/Han1meWinPlus-Setup.exe `
            build/Han1meWinPlus-windows-x64.zip `
            --title "Han1meWinPlus $env:GITHUB_REF_NAME" `
            --notes $notes `
            --verify-tag
